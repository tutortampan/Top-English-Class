<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" width="300" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(99, 102, 241, 0.4)" />
      <stop offset="100%" stop-color="rgba(147, 51, 234, 0.2)" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="300" height="400" rx="12" fill="url(#bgGrad)" />
  <rect x="1.5" y="1.5" width="297" height="397" rx="10.5" fill="none" stroke="url(#borderGrad)" stroke-width="2" />

  <!-- Avatar Silhouette -->
  <g transform="translate(150, 185)">
    <!-- Head -->
    <circle cx="0" cy="-35" r="42" fill="url(#avatarGrad)" opacity="0.85" />
    
    <!-- Face / Forehead highlight -->
    <ellipse cx="0" cy="-42" rx="28" ry="24" fill="#818cf8" opacity="0.25" />

    <!-- Shoulders / Bust -->
    <path d="M -70 55 C -70 10, -35 -5, 0 -5 C 35 -5, 70 10, 70 55 C 70 65, -70 65, -70 55 Z" fill="url(#avatarGrad)" opacity="0.85" />
  </g>

  <!-- Camera / Upload Icon Indicator -->
  <g transform="translate(150, 275)" opacity="0.4">
    <circle cx="0" cy="0" r="16" fill="rgba(255,255,255,0.08)" />
    <path d="M -7 -4 L -4 -4 L -2 -7 L 2 -7 L 4 -4 L 7 -4 C 8 -4, 9 -3, 9 -2 L 9 5 C 9 6, 8 7, 7 7 L -7 7 C -8 7, -9 6, -9 5 L -9 -2 C -9 -3, -8 -4, -7 -4 Z" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-linejoin="round" />
    <circle cx="0" cy="1.5" r="3.5" fill="none" stroke="#cbd5e1" stroke-width="1.5" />
  </g>

  <!-- Labels -->
  <text x="150" y="325" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#94a3b8" letter-spacing="1">3 : 4 PASFOTO</text>
  <text x="150" y="345" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#64748b" letter-spacing="0.5">Top English Program</text>
</svg>
